<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson — Lingua Trail</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app-shell">

  <div class="topbar">
    <a class="back-link" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      Exit lesson
    </a>
    <span class="brand" id="lesson-title-label">Lesson</span>
  </div>

  <div class="lesson-progress" id="lesson-progress-wrap">
    <div class="bar"><span id="progress-bar-fill" style="width:0%"></span></div>
    <span class="count" id="progress-count">0 / 0</span>
  </div>

  <!-- Main practice card -->
  <div class="card-stage" id="card-stage">
    <div class="sentence-card" id="sentence-card">

      <div class="card-face card-front">
        <p class="card-prompt" id="card-prompt-text">—</p>
        <button class="mic-button" id="mic-button" aria-label="Microphone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>
        </button>
        <p class="card-status" id="card-status-text">Get ready…</p>
        <button class="listen-btn" id="hint-btn" hidden aria-label="Hear the correct pronunciation">
          🔄 Hear pronunciation
        </button>
      </div>

      <div class="card-face card-back">
        <p class="card-target" id="card-target-text">—</p>
        <p class="card-english-echo" id="card-echo-text">—</p>
        <button class="listen-btn" id="listen-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/></svg>
          Hear it again
        </button>
        <button class="btn btn-primary" id="continue-btn" hidden>Continue</button>
      </div>

    </div>
  </div>

  <!-- Lesson result — shown in place, styled like the rest of this page -->
  <div class="notice-panel" id="panel-complete" hidden style="align-items:stretch">
    <div class="result-score" style="padding:0">
      <span class="big-score" id="complete-big-score">0%</span>
      <p class="sub" id="complete-sub">0 / 0 correct</p>
    </div>
    <div class="result-categories" id="complete-categories" style="grid-template-columns:repeat(2,1fr)">
      <div class="cat">
        <span class="cat-num" id="complete-correct-num">0</span>
        <span class="cat-label">Correct</span>
      </div>
      <div class="cat">
        <span class="cat-num" id="complete-wrong-num">0</span>
        <span class="cat-label">Wrong</span>
      </div>
    </div>
    <div class="action-row">
      <a class="btn btn-secondary" href="index.html">Dashboard</a>
      <button class="btn btn-primary" id="review-mistakes-btn" hidden>Review Mistakes</button>
      <a class="btn btn-primary" id="next-lesson-btn" href="#" hidden>Next lesson</a>
    </div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/progressEngine.js"></script>
<script src="js/speechEngine.js"></script>
<script src="js/lessonEngine.js"></script>
<script src="js/lessonPage.js"></script>
</body>
</html>
